name: Keep Supabase Awake
on:
  schedule:
    # Runs every 4 days at 00:00 UTC — comfortably inside Supabase's
    # 7-day free-tier inactivity pause window.
    - cron: '0 0 */4 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Health Endpoint
        run: |
          curl -s -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" > /dev/null
